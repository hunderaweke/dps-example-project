# Defaults for local development (matches compose.dev.yml).
# Override any key with an env var: APP_<SECTION>__<KEY>, e.g. APP_POSTGRES__URL.
app:
  name: dps-audit-service
  environment: development
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 15s
  cors_origins: ["*"]
  pprof_port: 0 # set e.g. 6060 to expose net/http/pprof

postgres:
  url: postgres://postgres:postgres@localhost:5432/audit?sslmode=disable
  max_conns: 10
  auto_migrate: true

valkey:
  url: redis://localhost:6379/0
  ttl: 5m

kafka:
  brokers: ["localhost:19092"]
  consumer_group: audit.universal
  topics:
    auth: auth.events
    onboarding: onboarding.events
    account: account.events
    payment: payment.events
    tpi: tpi.events
    ledger: ledger.events
    fee: fee.events
    airtime: airtime.events
    utility: utility.events
    airline: airline.events
    notification: notification.events
    adminops: adminops.events
    fuel: fuel.events
    lending: lending.events
    assistant: assistant.events
    ticketing: ticketing.events
    dwh: dwh.events

audit:
  batch_size: 500
  max_poll_records: 5000
  retry_max_backoff: 30s
  max_workers: 10

temporal:
  host_port: localhost:7233
  namespace: default
  task_queue: audit

telemetry:
  enabled: false
  otlp_endpoint: localhost:4317
  sample_ratio: 1.0
