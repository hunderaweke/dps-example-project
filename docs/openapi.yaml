components:
  schemas:
    CreateExampleBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateExampleBody.json
          format: uri
          readOnly: true
          type: string
        description:
          description: Optional description
          maxLength: 500
          type: string
        name:
          description: Human readable name
          examples:
            - my example
          maxLength: 100
          minLength: 3
          type: string
        owner_id:
          description: Account that owns the example
          examples:
            - acc_123
          minLength: 1
          type: string
      required:
        - name
        - owner_id
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Example:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Example.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        status:
          enum:
            - pending
            - processed
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - owner_id
        - status
        - created_at
        - updated_at
      type: object
    HealthResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthResponseBody.json
          format: uri
          readOnly: true
          type: string
        checks:
          additionalProperties:
            type: string
          type: object
        status:
          type: string
      required:
        - status
      type: object
    ListExamplesResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListExamplesResponseBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Example"
          type:
            - array
            - "null"
        limit:
          format: int32
          type: integer
        offset:
          format: int32
          type: integer
      required:
        - items
        - limit
        - offset
      type: object
info:
  description: Example service built from the hexagonal Go template.
  title: example-service
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - Health
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness probe
      tags:
        - Health
  /v1/examples:
    get:
      operationId: list-examples
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int32
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int32
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListExamplesResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List examples
      tags:
        - Examples
    post:
      operationId: create-example
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExampleBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an example
      tags:
        - Examples
  /v1/examples/{id}:
    get:
      operationId: get-example
      parameters:
        - description: Example ID
          in: path
          name: id
          required: true
          schema:
            description: Example ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an example by ID
      tags:
        - Examples
