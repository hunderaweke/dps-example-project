# Full stack: infrastructure (from compose.dev.yml) + migrations, api, worker.
#
#   make up    # build and start everything
#   make down  # stop and remove volumes
name: example-service

include:
  - compose.dev.yml

x-app-env: &app-env
  APP_APP__ENVIRONMENT: docker
  APP_POSTGRES__URL: postgres://postgres:postgres@postgres:5432/example?sslmode=disable
  APP_POSTGRES__AUTO_MIGRATE: "false" # the migrate job owns the schema
  APP_MONGO__URI: mongodb://mongo:27017
  APP_VALKEY__URL: redis://valkey:6379/0
  APP_KAFKA__BROKERS: redpanda:9092
  APP_TEMPORAL__HOST_PORT: temporal:7233
  APP_ACCOUNT__ADDRESS: account-stub:9090
  APP_TELEMETRY__ENABLED: "true"
  APP_TELEMETRY__OTLP_ENDPOINT: jaeger:4317

services:
  migrate:
    image: migrate/migrate:v4.20.1
    volumes: [./internal/const/migrations:/migrations:ro]
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/example?sslmode=disable
      - up
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: .
      target: api
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      valkey: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      temporal: { condition: service_healthy }
      account-stub: { condition: service_started }
    restart: unless-stopped
